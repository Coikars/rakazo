name: ava
description: Ava, a branded Flutter launcher for Alex's Rakazo fork.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/ava_icon.svg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/ava_icon.svg
  remove_alpha_ios: true
  adaptive_icon_background: '#F5F5F5'
  adaptive_icon_foreground: assets/ava_icon.svg
  web:
    generate: true
    image_path: assets/ava_icon.svg
    background_color: '#F5F5F5'
    theme_color: '#F5F5F5'
  windows:
    generate: true
    image_path: assets/ava_icon.svg
    icon_size: 48
