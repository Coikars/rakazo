name: ava
description: Ava client launcher for Alex's forked Rakazo app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/ava_icon.svg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/ava_icon.svg
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/ava_icon.svg
  windows:
    generate: true
    image_path: assets/ava_icon.svg
    icon_size: 48
